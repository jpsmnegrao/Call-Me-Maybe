# Project packaging configuration
# Defines project metadata

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "call-me-maybe"
version = "1.0.0"
description = "Function calling in Large Language Models"
requires-python = ">=3.10"
authors = [{name = "jpaim-so"}]
readme = "README.md"

dependencies = [
    "pydantic",
    "numpy",
]

[dependency-groups]
dev = [
    "mypy",
    "flake8",
]
