# Project packaging configuration
# Defines project metadata

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "call-me-maybe"
version = "1.0.0"
description = "Function calling in Large Language Models"
requires-python = ">=3.10"
authors = [{name = "jpaim-so"}]
readme = "README.md"

dependencies = [
    "pydantic>=2.0",
    "numpy",
    "llm_sdk",
	"accelerate",
]

[tool.uv.sources]
llm_sdk = { path = "llm_sdk" }

[dependency-groups]
dev = [
    "mypy",
    "flake8",
	"pytest",
]
